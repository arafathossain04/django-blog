{% extends 'base.html' %} {% block content %}
<div class="row">
	<!-- Left sidebar -->
	<!-- Load sidebar here -->
	{% include 'dashboard/sidebar.html' %}
	<!-- Right side content -->
    {% load crispy_forms_tags %}
	<div class="col-md-9">
        {% if perms.auth.view_user %}
        <h2 class="text-warning text-center">Update User</h2>
        <form action="{% url 'edit_user' user.id %}" method="POST" style="width: 500px; margin: auto;padding: 20px 20px;">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Update</button>
        </form>
        {% else %}
        <h2 class="text-danger">You don't have the permission of this page</h2>
        {% endif %}
	</div>
</div>
{% endblock %}
