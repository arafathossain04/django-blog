{% extends 'base.html' %} {% block content %}
<div class="row">
	<!-- Left sidebar -->
	<!-- Load sidebar here -->
	{% include 'dashboard/sidebar.html' %}
	<!-- Right side content -->
	<div class="col-md-9">
        <h2 class="text-warning text-center">All Categories</h2>
        <a href="{% url 'add_category' %}" class="btn btn-warning float-right mb-2"><i class="fa-solid fa-square-plus"></i> Add New</a>
			<table class="table table-hover">
				<thead class="bg-warning">
					<tr class="text-center">
						<th>Serial</th>
						<th>Categories</th>
						<th>Created_at</th>
						<th>Updated_at</th>
						<th>Action</th>
					</tr>
				</thead>
				<tbody>
                    {% for cat in categories %}
					<tr class="text-center">
						<td>{{ forloop.counter }}</th>
						<td>{{ cat }}</td>
						<td>{{ cat.created_at }}</td>
						<td>{{ cat.updated_at }}</td>
						<td>
                            <a href="{% url 'edit_category' cat.id %}"><i class="fa-solid fa-pen-to-square text-success"></i></a>
                            &nbsp;
                            <a href="{% url 'delete_category' cat.id %}"><i class="fa-solid fa-trash-can text-danger"></i></a>
                        </td>
					</tr>
                    {% endfor %}
				</tbody>
			</table>
	</div>
</div>
{% endblock %}
