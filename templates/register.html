{% extends 'base.html' %}
{% block content %}
{% load crispy_forms_tags %}

    <div style="width: 500px; margin: auto; box-shadow: rgba(0, 0, 0, 0.1) 0px 20px 25px -5px, rgba(0, 0, 0, 0.04) 0px 10px 10px -5px; border-radius: 4px; padding: 20px 20px;">
        <h3 class="text-center">Register</h3>
        <form action="{% url 'register' %}" method="POST">
            {% csrf_token %}
            {{ form | crispy }}
            <button type="submit" class="btn btn-warning">Register</button>
        </form>
    </div>

{% endblock %}
